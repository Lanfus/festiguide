<style>
@font-face{font-family:"Big Shoulders";src:url(../fonts/big-shoulders-display.woff2) format("woff2");font-weight:100 900}

h1 span{color:#f3c6d6}
.rule{width:150px;height:10px;background:#3ee6a8;margin-top:30px}
p{font-size:40px;margin-top:28px;max-width:960px;line-height:1.2}
.foot{position:absolute;left:0;right:0;bottom:0;height:18px;background:#3ee6a8}
