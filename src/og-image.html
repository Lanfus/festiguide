<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Source de l'image de partage og-image.png (1200x630).
     Pour la régénérer : capture de cette page en 1200x630 avec Playwright, enregistrée dans src/og-image.png. -->
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif;color:#fff;
background:linear-gradient(120deg,#a8274a 0%,#d93d5f 58%,#f58a4e 90%,#fcc65a 100%);position:relative}
.beams{position:absolute;inset:0;background:conic-gradient(from 168deg at 22% -25%,transparent 0 5deg,rgba(255,255,255,.16) 5deg 9deg,transparent 9deg 19deg,rgba(255,255,255,.15) 19deg 22deg,transparent 22deg 360deg),conic-gradient(from 188deg at 78% -25%,transparent 0 6deg,rgba(255,255,255,.15) 6deg 10deg,transparent 10deg 21deg,rgba(255,255,255,.13) 21deg 24deg,transparent 24deg 360deg)}
.dots{position:absolute;inset:0;opacity:.6;background-image:radial-gradient(circle,rgba(255,255,255,.8) 0 3px,transparent 4px),radial-gradient(circle,rgba(255,224,102,.9) 0 5px,transparent 6px),radial-gradient(circle,rgba(255,255,255,.6) 0 2px,transparent 3px);background-size:210px 180px,330px 270px,120px 150px;background-position:30px 40px,130px 100px,70px 20px}
.box{position:relative;padding:150px 90px 0}
.tag{display:inline-block;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);border-radius:99px;padding:8px 22px;font-size:28px;font-weight:600;letter-spacing:.02em}
h1{font-size:150px;line-height:1;margin-top:26px;font-weight:800;letter-spacing:-.03em;text-shadow:0 4px 24px rgba(110,25,40,.32)}
p{font-size:42px;margin-top:26px;max-width:900px;line-height:1.25;text-shadow:0 2px 12px rgba(110,25,40,.28)}
.bar{position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(90deg,#e8506a,#f58a4e 55%,#fcc65a)}
</style></head>
<body><div class="beams"></div><div class="dots"></div>
<div class="box"><span class="tag">France &amp; Belgique</span>
<h1>FestiGuide</h1>
<p>Dates, lieux, prix et line-up des grands festivals</p></div>
<div class="bar"></div></body></html>
